<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.5 system-ui,'Noto Nastaliq Urdu','Segoe UI',sans-serif;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--a);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;z-index:6;box-shadow:0 2px 10px #0003}

.lsel option{color:#111;background:#fff}

.npop button{width:100%;margin-top:6px}

main{padding:12px 14px 40px;max-width:820px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:14px;margin:10px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g .card{margin:0;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:100px;line-height:1.25;overflow-wrap:anywhere;min-width:0}

.g>button{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.25;overflow-wrap:anywhere;min-width:0}

.oh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.oh b{font-size:19px;overflow-wrap:anywhere}

.li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--b)}.li:last-of-type{border-bottom:0}

button:disabled{opacity:.5;cursor:not-allowed}

.lock{border:2px solid var(--w)}.lock.un{border-color:var(--ok)}
.warn{color:var(--w);font-weight:800}
button,.btn{font:inherit;padding:14px;border-radius:14px;border:1px solid var(--b);background:var(--c);color:var(--t);min-height:50px;cursor:pointer}
.p{background:var(--a);color:#fff;border:0}.ok{background:var(--ok);color:#fff;border:0}.bad{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row>*{flex:1}
